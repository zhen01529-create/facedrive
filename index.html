<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>face drive</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font:14px/1.4 -apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;left:0;right:0;top:0;bottom:130px;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px calc(10px + env(safe-area-inset-bottom));
       display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#000c;backdrop-filter:blur(8px)}
  #file{flex:0 1 120px;min-width:0;overflow:hidden;white-space:nowrap}
  button,input[type=file]::file-selector-button{font:inherit;padding:10px 14px;border-radius:10px;
       border:1px solid #444;background:#222;color:#eee}
  button:disabled{opacity:.4}
  #rec.on{background:#c33;border-color:#c33}
  #pvbtn.on{background:#357;border-color:#357}
  #sliders{display:flex;gap:8px;flex:1 1 100%}
  #sliders label{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:3px;font-size:12px;color:#ccc}
  #sliders input{flex:1 1 auto;min-width:40px}
  #hint{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;
       color:#aaa;font-size:12px;text-align:center;pointer-events:none}

  /* カメラ確認：普段は小窓（オンオフ）、基準を決めるときは全画面 */
  #pv{position:fixed;top:calc(44px + env(safe-area-inset-top));right:10px;width:210px;z-index:5;
      display:none;border-radius:12px;overflow:hidden;border:2px solid #555;background:#000}
  #pvbox{position:relative;line-height:0}
  #pvm{position:relative;transform:scaleX(-1);aspect-ratio:var(--ar,1.333)}
  #pvv,#pvo{position:absolute;inset:0;width:100%;height:100%}
  #pvt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       font-size:64px;font-weight:700;color:#4f4;text-shadow:0 0 10px #000;pointer-events:none}
  #pvs,#ok{display:none}

  #pv.full{top:0;right:0;left:0;bottom:0;width:auto;border:0;border-radius:0;z-index:20;
           display:flex;align-items:center;justify-content:center}
  #pv.full #pvbox{width:min(100vw, calc(100dvh * var(--ar,1.333)))}
  #pv.full #pvt{font-size:min(36vw,200px)}
  #pv.full #pvs{display:block;position:absolute;left:0;right:0;
                bottom:calc(92px + env(safe-area-inset-bottom));
                padding:8px 12px;text-align:center;font-size:17px;line-height:1.4;color:#fff;
                white-space:pre-line;text-shadow:0 0 6px #000,0 0 6px #000}
  #pv.full #ok{display:block;position:absolute;left:50%;transform:translateX(-50%);
               bottom:calc(20px + env(safe-area-inset-bottom));
               width:min(92vw,420px);padding:18px;font-size:20px;font-weight:700;
               border:2px solid #666;border-radius:16px;background:#333;color:#fff}
  #pv.full #ok.good{background:#2a2;border-color:#4f4}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hint">読み込み中...</div>

<div id="pv">
  <div id="pvbox">
    <div id="pvm"><video id="pvv" playsinline muted></video><canvas id="pvo"></canvas></div>
    <div id="pvt"></div>
  </div>
  <div id="pvs"></div>
  <button id="ok">確定</button>
</div>

<div id="bar">
  <input id="file" type="file" accept="image/*">
  <button id="start" disabled>開始</button>
  <button id="calib" disabled>基準</button>
  <button id="pvbtn" disabled>窓</button>
  <button id="rec" disabled>録画</button>
  <div id="sliders">
    <label>頭<input id="hpow" type="range" min="0" max="300" value="100"></label>
    <label>表情<input id="epow" type="range" min="0" max="300" value="110"></label>
    <label>髪<input id="hairpow" type="range" min="0" max="150" value="100"></label>
    <label>首服<input id="bpow" type="range" min="0" max="200" value="100"></label>
  </div>
</div>

<script type="importmap">
{"imports":{"@mediapipe/tasks-vision":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"}}
</script>

<script type="module">
import { FaceLandmarker, ImageSegmenter, FilesetResolver } from '@mediapipe/tasks-vision';

const $ = id => document.getElementById(id);
const cv = $('cv');
const gl = cv.getContext('webgl2', { alpha:false, preserveDrawingBuffer:true });
const hint = $('hint'), btnStart = $('start'), btnCalib = $('calib'), btnRec = $('rec'), pvbtn = $('pvbtn');
const hpow = $('hpow'), epow = $('epow'), hairpow = $('hairpow'), bpow = $('bpow');
const pv = $('pv'), pvv = $('pvv'), pvo = $('pvo'), pvt = $('pvt'), pvs = $('pvs'), btnOk = $('ok');

const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const SEG_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite';
const MAX = 1024;
const GX = 44;                                  // 周囲メッシュの横方向の分割数
const LIP = [78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95]; // 口の内側
const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,
              148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];          // 顔の輪郭
const TOL = 4;                                  // 正面の目安の許容角度（度）
const MOUTH_MAX = 0.05;                         // 口の開きの目安（顔の高さ比）
const HIST_N = 6;                               // 確定時に平均するフレーム数
const S_MIN = 0.85, S_MAX = 1.25;               // 顔の拡大縮小の範囲（ズームの暴れ防止）
const MIME = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp8','video/webm']
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

let landmarker, segmenter = null, video = null, ts = 0, recorder = null, chunks = [];
let prog, vaoMesh, bufMesh, vaoMouth, bufMouth, srcTex, uUse, uCol;

// 写真側
let W = 0, H = 0, nF = 0, nV = 0, tris = null, idxCount = 0;
let PP, Cp = [0,0], rP = 1, wA, wB, ewx, ewy, vtx, TG, restOpen = 0, ready = false;
// wA = 髪・顔まわりが頭に付いて動く度合い、wB = 首・服が付いて動く度合い
// ewx/ewy = 表情の効き具合（顔の輪郭ではゼロ、内側ほど強い）
// カメラ側
let sm = null, base = null, bcx = 0, bcy = 0, den = 1, baseR = 1;
let ang = null;                                 // 顔の向き {yaw, pitch, roll}（度、平滑化済み）
// 基準の確定
let calState = 'idle', pvPinned = false, pvTimer = 0, hist = [];

const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

async function boot() {
  const fs = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await FaceLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' },
    runningMode: 'VIDEO', numFaces: 1,
    outputFacialTransformationMatrixes: true
  });
  let segNote = '';
  try {                                         // 髪などを分けるモデル（写真1枚に1回だけ使う）
    segmenter = await ImageSegmenter.createFromOptions(fs, {
      baseOptions: { modelAssetPath: SEG_MODEL, delegate: 'CPU' },
      runningMode: 'IMAGE', outputCategoryMask: true, outputConfidenceMasks: false
    });
  } catch (e) {
    segmenter = null;
    segNote = '（髪の検出モデルが読めなかったので簡易モードです）';
  }
  hint.textContent = '写真を選んでください' + segNote;
}
boot().catch(e => hint.textContent = 'モデル読込失敗: ' + e.message);

/* ---------- WebGL ---------- */
function initGL() {
  const vs = `#version 300 es
  layout(location=0) in vec2 aRest;
  layout(location=1) in vec2 aTarget;
  out vec2 vUV;
  void main(){
    vUV = aRest;
    gl_Position = vec4(aTarget.x*2.0-1.0, 1.0-aTarget.y*2.0, 0.0, 1.0);
  }`;
  const fs = `#version 300 es
  precision highp float;
  in vec2 vUV; out vec4 o;
  uniform sampler2D uTex;
  uniform float uUse;
  uniform vec4 uCol;
  void main(){ o = uUse > 0.5 ? uCol : texture(uTex, vUV); }`;
  const mk = (t, s) => {
    const sh = gl.createShader(t);
    gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  uUse = gl.getUniformLocation(prog, 'uUse');
  uCol = gl.getUniformLocation(prog, 'uCol');
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0, 0, 0, 1);

  vaoMesh = gl.createVertexArray(); gl.bindVertexArray(vaoMesh);
  bufMesh = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufMesh);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());

  vaoMouth = gl.createVertexArray(); gl.bindVertexArray(vaoMouth);
  bufMouth = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufMouth);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);
}

function uploadTexture(c) {
  if (srcTex) gl.deleteTexture(srcTex);
  srcTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  cv.width = W; cv.height = H;
}

/* ---------- Delaunay ---------- */
function mkTri(P, a, b, c) {
  const A = P[a], B = P[b], C = P[c];
  const d = 2 * (A.x*(B.y-C.y) + B.x*(C.y-A.y) + C.x*(A.y-B.y));
  if (Math.abs(d) < 1e-9) return { a, b, c, cx:0, cy:0, r2:Infinity };
  const a2 = A.x*A.x + A.y*A.y, b2 = B.x*B.x + B.y*B.y, c2 = C.x*C.x + C.y*C.y;
  const cx = (a2*(B.y-C.y) + b2*(C.y-A.y) + c2*(A.y-B.y)) / d;
  const cy = (a2*(C.x-B.x) + b2*(A.x-C.x) + c2*(B.x-A.x)) / d;
  return { a, b, c, cx, cy, r2:(A.x-cx)**2 + (A.y-cy)**2 };
}

function triangulate(pts) {
  const n = pts.length;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pts) {
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
  }
  const d = Math.max(x1-x0, y1-y0) * 100, mx = (x0+x1)/2, my = (y0+y1)/2;
  const P = pts.map(p => ({ x: p.x + Math.random()*1e-3, y: p.y + Math.random()*1e-3 }));
  P.push({x:mx-d, y:my-d}, {x:mx, y:my+d}, {x:mx+d, y:my-d});
  let T = [mkTri(P, n, n+1, n+2)];
  for (let i = 0; i < n; i++) {
    const p = P[i], keep = [], edges = new Map();
    for (const t of T) {
      if ((p.x-t.cx)**2 + (p.y-t.cy)**2 < t.r2) {
        for (const [u, v] of [[t.a,t.b],[t.b,t.c],[t.c,t.a]]) {
          const k = u < v ? u+','+v : v+','+u;
          edges.set(k, (edges.get(k) || 0) + 1);
        }
      } else keep.push(t);
    }
    T = keep;
    for (const [k, c] of edges) {
      if (c === 1) { const [u, v] = k.split(',').map(Number); T.push(mkTri(P, u, v, i)); }
    }
  }
  return T.filter(t => t.a < n && t.b < n && t.c < n);
}

/* ---------- 髪・体の分割 ---------- */
// 戻り値：{ data, w, h }。分類は 0背景 1髪 2体の肌 3顔の肌 4服 5その他
function segment(canvas) {
  if (!segmenter) return null;
  try {
    const res = segmenter.segment(canvas);
    const m = res.categoryMask;
    const data = new Uint8Array(m.getAsUint8Array());
    const out = { data, w: m.width, h: m.height };
    if (m.close) m.close();
    return out.data.length === out.w * out.h ? out : null;
  } catch (e) { return null; }
}

/* ---------- 写真の読み込み ---------- */
$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  ready = false;
  hint.textContent = '顔を検出中...';
  try {
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();

    W = img.width; H = img.height;
    if (Math.max(W, H) > MAX) { const s = MAX / Math.max(W, H); W = Math.round(W*s); H = Math.round(H*s); }
    const pic = document.createElement('canvas');   // 縮小した写真。顔検出・分割・テクスチャに共通で使う
    pic.width = W; pic.height = H;
    pic.getContext('2d').drawImage(img, 0, 0, W, H);

    const r = landmarker.detectForVideo(pic, ++ts);
    const lm = r.faceLandmarks?.[0];
    if (!lm) { hint.textContent = '顔が見つかりません'; return; }

    hint.textContent = '髪・体を検出中...';
    await new Promise(res => setTimeout(res, 30));  // 表示を更新させる
    const seg = segment(pic);

    nF = lm.length;
    PP = new Float32Array(nF * 2);
    Cp = [0, 0];
    for (let i = 0; i < nF; i++) {
      PP[2*i] = lm[i].x * W; PP[2*i+1] = lm[i].y * H;
      Cp[0] += PP[2*i]; Cp[1] += PP[2*i+1];
    }
    Cp[0] /= nF; Cp[1] /= nF;
    let q = 0;
    for (let i = 0; i < nF; i++) q += (PP[2*i]-Cp[0])**2 + (PP[2*i+1]-Cp[1])**2;
    rP = Math.sqrt(q / nF);                       // 顔の大きさの基準（px）
    const chinY = PP[2*152+1];

    // 表情の効き具合：輪郭では0、内側ほど強く。下半分は縦方向（顎の上下）だけ残す
    ewx = new Float32Array(nF); ewy = new Float32Array(nF);
    const noseY = PP[2*1+1], mouthY = PP[2*13+1];
    for (let i = 0; i < nF; i++) {
      let dm = 1e9;
      for (const o of OVAL) dm = Math.min(dm, Math.hypot(PP[2*i] - PP[2*o], PP[2*i+1] - PP[2*o+1]));
      const fade = sstep(0.0, 0.5, dm / rP);
      const low = sstep(noseY, mouthY, PP[2*i+1]);
      ewx[i] = fade;
      ewy[i] = fade + (1 - fade) * low;
    }

    // 周囲の格子点（顔に近すぎる点は除く）
    const pts = [];
    for (let i = 0; i < nF; i++) pts.push({ x: PP[2*i], y: PP[2*i+1] });
    const gx = GX, gy = Math.max(8, Math.round(GX * H / W));
    const cell = W / gx;
    const la = [], lb = [];
    for (let j = 0; j <= gy; j++) {
      for (let i = 0; i <= gx; i++) {
        const x = i * W / gx, y = j * H / gy;
        let d = 1e9;
        for (let k = 0; k < nF; k++) d = Math.min(d, Math.hypot(x - PP[2*k], y - PP[2*k+1]));
        if (d < rP * 0.3) continue;
        if (y > chinY) d *= 1.5;                  // 首から下は追従を弱める
        const dn = d / rP;
        const pin = i === 0 || j === 0 || i === gx || j === gy;
        pts.push({ x, y });
        if (pin) { la.push(0); lb.push(0); continue; }

        if (!seg) {                               // 検出なし：距離だけで決める（簡易モード）
          la.push(0); lb.push(1 - sstep(0.3, 4.2, dn));
          continue;
        }
        // 周囲7x7の分類を平均して、境目を広くなだらかにする（折れ・裂けの防止）
        let a = 0, b = 0;
        for (let u = -3; u <= 3; u++) {
          for (let v = -3; v <= 3; v++) {
            const sx = clamp(x + u * cell * 0.8, 0, W - 1), sy = clamp(y + v * cell * 0.8, 0, H - 1);
            const cls = seg.data[Math.floor(sy / H * seg.h) * seg.w + Math.floor(sx / W * seg.w)];
            if (cls === 1) a += 1 - sstep(0.3, 4.2, dn);                 // 髪：顔に近いほど強く、離れるほど弱く（立体感）
            else if (cls === 3) a += 1;                                  // 顔の肌：頭と一体
            else if (cls === 5) a += 1 - sstep(0.5, 2.5, dn);            // その他（ヘアバンド等）
            else if (cls === 2) b += 1 - sstep(0.3, 3.0, dn);            // 首・体の肌
            else if (cls === 4) b += 0.35 * (1 - sstep(0.3, 3.0, dn));   // 服：少しだけ
          }                                                              // 背景(0)は動かさない
        }
        la.push(a / 49); lb.push(b / 49);
      }
    }
    wA = Float32Array.from(la);
    wB = Float32Array.from(lb);
    nV = pts.length;
    tris = triangulate(pts);
    if (tris.length < 100) { hint.textContent = 'メッシュ生成に失敗'; return; }

    const idx = new Uint16Array(tris.length * 3);
    tris.forEach((t, i) => { idx[3*i] = t.a; idx[3*i+1] = t.b; idx[3*i+2] = t.c; });
    idxCount = idx.length;
    vtx = new Float32Array(nV * 4);
    for (let i = 0; i < nV; i++) {
      vtx[4*i] = pts[i].x / W; vtx[4*i+1] = pts[i].y / H;
      vtx[4*i+2] = vtx[4*i]; vtx[4*i+3] = vtx[4*i+1];
    }
    TG = new Float32Array(nF * 2);
    restOpen = Math.abs(PP[2*14+1] - PP[2*13+1]);

    if (!prog) initGL();
    uploadTexture(pic);
    gl.bindVertexArray(vaoMesh);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    ready = true;
    btnStart.disabled = false;
    hint.textContent = (seg ? '髪を検出しました。' : '簡易モードです。') + `メッシュ ${tris.length} 面。開始を押してください`;
    draw(true);
  } catch (err) { hint.textContent = '失敗: ' + err.message; }
};

/* ---------- カメラ ---------- */
btnStart.onclick = async () => {
  try {
    if (!video) {
      video = pvv;
      video.playsInline = true; video.muted = true;
      const st = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
      video.srcObject = st;
      await video.play();
      pv.style.setProperty('--ar', video.videoWidth / video.videoHeight);
      pvo.width = video.videoWidth; pvo.height = video.videoHeight;
      loop();
    }
    btnRec.disabled = false; btnCalib.disabled = false; pvbtn.disabled = false;
    resetBase();
  } catch (err) { hint.textContent = 'カメラ不可: ' + err.message; }
};
btnCalib.onclick = resetBase;

// 自分で確定：押した直前の数フレームを平均して基準にする
btnOk.onclick = () => {
  if (calState !== 'wait') return;
  if (!hist.length) { pvs.textContent = '顔が見えません\n顔をカメラに映してください'; return; }
  const acc = new Float32Array(nF * 2);
  for (const h of hist) for (let i = 0; i < acc.length; i++) acc[i] += h[i];
  setBase(acc, hist.length);
};

// 小窓のオンオフ（基準の確定中は全画面なので無効）
pvbtn.onclick = () => {
  if (calState !== 'done') return;
  pvPinned = !pvPinned;
  pvbtn.classList.toggle('on', pvPinned);
  showPv(pvPinned);
};

const showPv = on => { pv.style.display = on ? (pv.classList.contains('full') ? 'flex' : 'block') : 'none'; };
const setFull = on => { pv.classList.toggle('full', on); };

function resetBase() {
  base = null; sm = null; hist = [];
  calState = 'wait';
  clearTimeout(pvTimer);
  setFull(true);                                  // 基準を決める間は全画面
  showPv(true);
  btnOk.classList.remove('good');
  pvt.textContent = '';
  pvs.textContent = '●を中央の輪に入れて、整ったら「確定」を押してください';
  hint.textContent = '';
}

function setBase(acc, n) {
  base = new Float32Array(acc.length);
  bcx = 0; bcy = 0;
  for (let i = 0; i < acc.length; i++) base[i] = acc[i] / n;
  const m = base.length / 2;
  for (let i = 0; i < m; i++) { bcx += base[2*i]; bcy += base[2*i+1]; }
  bcx /= m; bcy /= m;
  den = 0;
  for (let i = 0; i < m; i++) den += (base[2*i]-bcx)**2 + (base[2*i+1]-bcy)**2;
  baseR = Math.sqrt(den / m);
  calState = 'done';
  pvt.textContent = '✓';
  pvs.textContent = '';
  hint.textContent = '';
  clearGuide();
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => {                    // ✓を少し見せてから元の画面に戻る
    pvt.textContent = '';
    setFull(false);
    showPv(pvPinned);                             // 小窓は「窓」ボタンでオンにしたときだけ
  }, 600);
}

/* ---------- 顔の向き（3D回転行列から度数に） ---------- */
function getAngles(r) {
  const m = r.facialTransformationMatrixes?.[0]?.data;
  if (!m || m.length < 16) return null;
  const R = (row, col) => m[col * 4 + row];       // 列優先の4x4
  const d = 180 / Math.PI;
  return {
    yaw:   Math.atan2(R(0,2), R(2,2)) * d,        // 左右
    pitch: Math.atan2(-R(1,2), R(2,2)) * d,       // 上下
    roll:  Math.atan2(R(1,0), R(1,1)) * d         // 首の傾き
  };
}
function smoothAngles(a) {
  if (!a) { ang = null; return; }
  if (!ang) { ang = { ...a }; return; }
  for (const k of ['yaw', 'pitch', 'roll']) ang[k] += (a[k] - ang[k]) * 0.4;
}

/* 正面の目安。OKなら空文字、だめなら理由を返す（確定自体は押せば常にできる） */
function faceCheck(cam, vw, vh) {
  let cx = 0, cy = 0;
  for (const p of cam) { cx += p.x; cy += p.y; }
  cx /= cam.length; cy /= cam.length;
  const a = cam[33], b = cam[263];
  const size = Math.hypot((b.x - a.x) * vw, (b.y - a.y) * vh) / vw;
  if (size < 0.10) return 'もう少し近づいてください';
  if (size > 0.45) return 'もう少し離れてください';
  if (Math.abs(cx - 0.5) > 0.16 || Math.abs(cy - 0.5) > 0.22) return '顔を中央に寄せてください';
  if (ang) {
    if (Math.abs(ang.yaw) > TOL) return '左右の向きがずれています';
    if (Math.abs(ang.pitch) > TOL) return '上下の向きがずれています（あごの上げ下げ）';
    if (Math.abs(ang.roll) > TOL) return '首が傾いています';
  } else {                                        // 回転行列が取れない場合の代替判定
    const n = cam[1];
    const dist = Math.hypot((b.x - a.x) * vw, (b.y - a.y) * vh);
    const yaw = ((n.x - (a.x + b.x) / 2) * vw) / dist;
    if (Math.abs(yaw) > 0.1) return 'まっすぐ正面を向いてください';
  }
  const faceH = Math.hypot((cam[152].x - cam[10].x) * vw, (cam[152].y - cam[10].y) * vh);
  const mouth = Math.hypot((cam[14].x - cam[13].x) * vw, (cam[14].y - cam[13].y) * vh) / faceH;
  if (mouth > MOUTH_MAX) return '口を閉じてください';
  return '';
}

function drawGuide(cam, ok, vw, vh) {
  const c = pvo.getContext('2d');
  c.clearRect(0, 0, pvo.width, pvo.height);
  const lw = Math.max(3, vw / 120);
  const col = ok ? '#4f4' : (cam ? '#f66' : '#fff');
  const cx = vw / 2, cy = vh / 2;
  c.lineWidth = lw;
  c.strokeStyle = col;
  c.beginPath();
  c.ellipse(cx, cy, vw * 0.19, vh * 0.34, 0, 0, Math.PI * 2);
  c.stroke();

  // 照準：輪が許容範囲、●が今の顔の向き
  const k = vw * 0.012;                           // 1度あたりのpx
  c.lineWidth = Math.max(2, vw / 220);
  c.strokeStyle = '#fff';
  c.beginPath(); c.arc(cx, cy, TOL * k, 0, Math.PI * 2); c.stroke();
  c.beginPath();
  c.moveTo(cx - TOL * k * 1.8, cy); c.lineTo(cx + TOL * k * 1.8, cy);
  c.moveTo(cx, cy - TOL * k * 1.8); c.lineTo(cx, cy + TOL * k * 1.8);
  c.stroke();

  if (cam && ang) {
    const dx = clamp(ang.yaw * k, -vw * 0.3, vw * 0.3);
    const dy = clamp(ang.pitch * k, -vh * 0.3, vh * 0.3);
    c.fillStyle = col;
    c.beginPath(); c.arc(cx + dx, cy + dy, Math.max(6, vw / 55), 0, Math.PI * 2); c.fill();
    // 傾きは水平線の傾きで表示
    const L = vw * 0.12, rr = ang.roll * Math.PI / 180;
    c.strokeStyle = col; c.lineWidth = lw;
    c.beginPath();
    c.moveTo(cx - L * Math.cos(rr), cy + L * Math.sin(rr));
    c.lineTo(cx + L * Math.cos(rr), cy - L * Math.sin(rr));
    c.stroke();
  }
}
function clearGuide() {
  pvo.getContext('2d').clearRect(0, 0, pvo.width, pvo.height);
}

const angText = () => ang
  ? `左右 ${ang.yaw.toFixed(0)}°  上下 ${ang.pitch.toFixed(0)}°  傾き ${ang.roll.toFixed(0)}°`
  : '';

/* 基準を決めている間の表示更新（毎フレーム）。確定はボタンを押したときだけ */
function calibrate(cam, vw, vh) {
  if (cam) {                                      // 直近の数フレームを保存しておく
    hist.push(Float32Array.from(sm));
    if (hist.length > HIST_N) hist.shift();
  } else hist.length = 0;

  const msg = cam ? faceCheck(cam, vw, vh) : '顔が見えません';
  const ok = msg === '';
  drawGuide(cam, ok, vw, vh);
  btnOk.classList.toggle('good', ok);
  pvs.textContent = (ok ? '正面です。よければ「確定」を押してください' : msg) + '\n' + angText();
}

/* ---------- メインループ ---------- */
function loop() {
  requestAnimationFrame(loop);
  if (!ready) return;
  ts = Math.max(performance.now(), ts + 1);
  const r = landmarker.detectForVideo(video, ts);
  const cam = r.faceLandmarks?.[0] && r.faceLandmarks[0].length >= nF ? r.faceLandmarks[0] : null;
  const vw = video.videoWidth, vh = video.videoHeight;
  smoothAngles(cam ? getAngles(r) : null);

  if (cam) {
    if (!sm) {
      sm = new Float32Array(nF * 2);
      for (let i = 0; i < nF; i++) { sm[2*i] = (1 - cam[i].x) * vw; sm[2*i+1] = cam[i].y * vh; }
    } else {
      for (let i = 0; i < nF; i++) {
        sm[2*i] += ((1 - cam[i].x) * vw - sm[2*i]) * 0.5;
        sm[2*i+1] += (cam[i].y * vh - sm[2*i+1]) * 0.5;
      }
    }
  }

  if (!base) {
    if (calState === 'wait') calibrate(cam, vw, vh);
    draw(true);
    return;
  }
  update();
  draw(false);
}

function update() {
  const hg = hpow.value / 100, eg = epow.value / 100;
  const hairg = hairpow.value / 100, bg = bpow.value / 100;
  let cx = 0, cy = 0;
  for (let i = 0; i < nF; i++) { cx += sm[2*i]; cy += sm[2*i+1]; }
  cx /= nF; cy /= nF;

  // 基準→現在の 回転＋拡大縮小 を最小二乗で求める
  let re = 0, im = 0;
  for (let i = 0; i < nF; i++) {
    const sx = sm[2*i] - cx, sy = sm[2*i+1] - cy;
    const bx = base[2*i] - bcx, by = base[2*i+1] - bcy;
    re += sx*bx + sy*by;
    im += sy*bx - sx*by;
  }
  const s = clamp(Math.hypot(re, im) / den, S_MIN, S_MAX);
  const th = clamp(Math.atan2(im, re), -1, 1);
  const zr = s * Math.cos(th), zi = s * Math.sin(th);

  // 頭の動き（ゲイン付き）
  const f = rP / baseR;
  const s2 = 1 + (s - 1) * hg, th2 = th * hg;
  const zr2 = s2 * Math.cos(th2), zi2 = s2 * Math.sin(th2);
  let Tx = f * hg * (cx - bcx), Ty = f * hg * (cy - bcy);
  const tl = Math.hypot(Tx, Ty), tm = rP * 1.0;   // 顔の移動は顔の大きさ程度まで
  if (tl > tm) { Tx *= tm / tl; Ty *= tm / tl; }
  const pose = (px, py) => {
    const dx = px - Cp[0], dy = py - Cp[1];
    return [Cp[0] + Tx + zr2*dx - zi2*dy, Cp[1] + Ty + zi2*dx + zr2*dy];
  };

  const maxE = rP * 0.6, zz = zr*zr + zi*zi;
  for (let i = 0; i < nF; i++) {
    const sx = sm[2*i] - cx, sy = sm[2*i+1] - cy;
    const bx = base[2*i] - bcx, by = base[2*i+1] - bcy;
    // 表情＝姿勢を引いた残り（頭の座標系に戻す）
    const rx = sx - (zr*bx - zi*by), ry = sy - (zi*bx + zr*by);
    const hx = (rx*zr + ry*zi) / zz, hy = (ry*zr - rx*zi) / zz;
    let ex = (zr2*hx - zi2*hy) * f * eg * ewx[i];   // 輪郭では0 → 隣の髪と食い違わない
    let ey = (zi2*hx + zr2*hy) * f * eg * ewy[i];
    const l = Math.hypot(ex, ey);
    if (l > maxE) { ex *= maxE / l; ey *= maxE / l; }
    const [qx, qy] = pose(PP[2*i], PP[2*i+1]);
    TG[2*i] = qx + ex; TG[2*i+1] = qy + ey;
    vtx[4*i+2] = TG[2*i] / W; vtx[4*i+3] = TG[2*i+1] / H;
  }
  for (let g = 0; nF + g < nV; g++) {             // 髪・首・服は、分類に応じた度合いで頭に付いて動く
    const i = nF + g, px = vtx[4*i] * W, py = vtx[4*i+1] * H;
    const w = clamp(wA[g] * hairg + wB[g] * bg, 0, 1.2);
    if (w <= 0) { vtx[4*i+2] = vtx[4*i]; vtx[4*i+3] = vtx[4*i+1]; continue; }
    const [qx, qy] = pose(px, py);
    vtx[4*i+2] = (px + (qx - px) * w) / W;
    vtx[4*i+3] = (py + (qy - py) * w) / H;
  }
}

function draw(rest) {
  if (!prog || !srcTex) return;
  if (rest) for (let i = 0; i < nV; i++) { vtx[4*i+2] = vtx[4*i]; vtx[4*i+3] = vtx[4*i+1]; }
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.bindVertexArray(vaoMesh);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufMesh);
  gl.bufferData(gl.ARRAY_BUFFER, vtx, gl.DYNAMIC_DRAW);
  gl.uniform1f(uUse, 0);
  gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_SHORT, 0);

  if (rest) return;
  // 口を開けたときだけ、口の中を暗く塗る
  const open = Math.abs(TG[2*14+1] - TG[2*13+1]);
  const a = clamp((open - restOpen) / (rP * 0.1), 0, 1);
  if (a <= 0.01) return;
  let mx = 0, my = 0;
  for (const k of LIP) { mx += TG[2*k]; my += TG[2*k+1]; }
  mx /= LIP.length; my /= LIP.length;
  const m = new Float32Array(LIP.length * 3 * 4);
  let o = 0;
  const put = (x, y) => { m[o++] = x/W; m[o++] = y/H; m[o++] = x/W; m[o++] = y/H; };
  for (let k = 0; k < LIP.length; k++) {
    const p = LIP[k], q = LIP[(k+1) % LIP.length];
    put(mx, my); put(TG[2*p], TG[2*p+1]); put(TG[2*q], TG[2*q+1]);
  }
  gl.bindVertexArray(vaoMouth);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufMouth);
  gl.bufferData(gl.ARRAY_BUFFER, m, gl.DYNAMIC_DRAW);
  gl.uniform1f(uUse, 1);
  gl.uniform4f(uCol, 0.17, 0.04, 0.06, a);
  gl.drawArrays(gl.TRIANGLES, 0, LIP.length * 3);
}

/* ---------- 録画 ---------- */
btnRec.onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!MIME) { hint.textContent = 'この端末は録画非対応'; return; }
  chunks = [];
  recorder = new MediaRecorder(cv.captureStream(30), { mimeType: MIME });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: MIME }));
    a.download = MIME.includes('mp4') ? 'out.mp4' : 'out.webm';
    a.click();
    recorder = null;
    btnRec.classList.remove('on');
    btnRec.textContent = '録画';
  };
  recorder.start();
  btnRec.classList.add('on');
  btnRec.textContent = '停止';
};
</script>

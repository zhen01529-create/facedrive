<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>face drive</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font:14px/1.4 -apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px calc(10px + env(safe-area-inset-bottom));
       display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#000c;backdrop-filter:blur(8px)}
  #file{flex:0 1 110px;min-width:0;overflow:hidden;white-space:nowrap}
  button,input[type=file]::file-selector-button{font:inherit;padding:10px 14px;border-radius:10px;
       border:1px solid #444;background:#222;color:#eee}
  button:disabled{opacity:.4}
  #rec.on{background:#c33;border-color:#c33}
  #pow{flex:1 1 120px;min-width:90px}
  label{display:flex;align-items:center;gap:4px;font-size:12px;color:#ccc}
  #hint{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;
       color:#aaa;font-size:12px;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hint">読み込み中...</div>
<div id="bar">
  <input id="file" type="file" accept="image/*">
  <button id="start" disabled>開始</button>
  <button id="rec" disabled>録画</button>
  <input id="pow" type="range" min="0" max="200" value="100">
  <label><input id="rot" type="checkbox" checked>傾き</label>
</div>

<script type="importmap">
{"imports":{"@mediapipe/tasks-vision":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"}}
</script>

<script type="module">
import { FaceLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2', { alpha:false, preserveDrawingBuffer:true });
const hint = document.getElementById('hint');
const btnStart = document.getElementById('start');
const btnRec = document.getElementById('rec');
const pow = document.getElementById('pow');
const rot = document.getElementById('rot');

let landmarker, srcPts = null, allPts = null, nFace = 0, near = null;
let scx = 0, scy = 0;
let srcTex = null, tris = [], buf = null, prog = null;
let video = null, smooth = null, recorder = null, chunks = [], ts = 0;
let angS = 0, sclS = 1;

// 剛体（頭の向き・距離）推定用の安定点。
// 額・こめかみ・鼻筋・目尻だけを使い、口・顎・眉・瞼の動きを残差として残す。
const STABLE = [
  10,151,9,8,107,336,296,334,293,
  127,356,234,454,93,323,132,361,58,288,172,397,
  6,168,197,195,5,4,1,2,98,327,33,133,362,263
];

const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const MAX = 1024;

const MIME = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp8','video/webm']
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

async function boot() {
  const fs = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await FaceLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' },
    runningMode: 'VIDEO', numFaces: 1
  });
  hint.textContent = '写真を選んでください';
}
boot().catch(e => hint.textContent = 'モデル読込失敗: ' + e.message);

function initGL() {
  const vs = `#version 300 es
  in vec2 aRest, aTarget;
  out vec2 vUV;
  void main(){
    vUV = aRest;
    gl_Position = vec4(aTarget.x*2.0-1.0, 1.0-aTarget.y*2.0, 0.0, 1.0);
  }`;
  const fs = `#version 300 es
  precision highp float;
  in vec2 vUV; out vec4 o;
  uniform sampler2D uTex;
  void main(){ o = texture(uTex, vUV); }`;
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
  prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.clearColor(0, 0, 0, 1);
  buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const aR = gl.getAttribLocation(prog, 'aRest'), aT = gl.getAttribLocation(prog, 'aTarget');
  gl.enableVertexAttribArray(aR); gl.enableVertexAttribArray(aT);
  gl.vertexAttribPointer(aR, 2, gl.FLOAT, false, 16, 0);
  gl.vertexAttribPointer(aT, 2, gl.FLOAT, false, 16, 8);
}

function uploadTexture(img) {
  let w = img.width, h = img.height;
  if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  if (srcTex) gl.deleteTexture(srcTex);
  srcTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  cv.width = w; cv.height = h;
}

function circ(P, t) {
  const {x:ax,y:ay} = P[t.a], {x:bx,y:by} = P[t.b], {x:cx,y:cy} = P[t.c];
  const d = 2 * (ax*(by-cy) + bx*(cy-ay) + cx*(ay-by));
  if (Math.abs(d) < 1e-12) return { x:0, y:0, r2: Infinity };
  const ux = ((ax*ax+ay*ay)*(by-cy) + (bx*bx+by*by)*(cy-ay) + (cx*cx+cy*cy)*(ay-by)) / d;
  const uy = ((ax*ax+ay*ay)*(cx-bx) + (bx*bx+by*by)*(ax-cx) + (cx*cx+cy*cy)*(bx-ax)) / d;
  return { x:ux, y:uy, r2:(ax-ux)**2 + (ay-uy)**2 };
}

function triangulate(pts) {
  const n = pts.length;
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  for (const p of pts) { mnx=Math.min(mnx,p.x); mny=Math.min(mny,p.y); mxx=Math.max(mxx,p.x); mxy=Math.max(mxy,p.y); }
  const d = Math.max(mxx-mnx, mxy-mny) * 10, cx=(mnx+mxx)/2, cy=(mny+mxy)/2;
  const P = pts.concat([{x:cx-d,y:cy-d},{x:cx,y:cy+d},{x:cx+d,y:cy-d}]);
  let t = [{a:n,b:n+1,c:n+2}];
  for (let i = 0; i < n; i++) {
    const p = P[i], bad = [], keep = [];
    for (const tr of t) {
      const c = circ(P, tr);
      if ((p.x-c.x)**2 + (p.y-c.y)**2 < c.r2) bad.push(tr); else keep.push(tr);
    }
    const edge = new Map();
    for (const tr of bad) for (const [u,v] of [[tr.a,tr.b],[tr.b,tr.c],[tr.c,tr.a]]) {
      const k = u < v ? u+','+v : v+','+u;
      edge.set(k, (edge.get(k) || 0) + 1);
    }
    t = keep;
    for (const [k, c] of edge) if (c === 1) { const [u,v] = k.split(',').map(Number); t.push({a:u,b:v,c:i}); }
  }
  const span = Math.max(mxx-mnx, mxy-mny);
  return t.filter(tr => {
    if (tr.a>=n || tr.b>=n || tr.c>=n) return false;
    const A=P[tr.a],B=P[tr.b],C=P[tr.c];
    const e = Math.max(Math.hypot(A.x-B.x,A.y-B.y), Math.hypot(B.x-C.x,B.y-C.y), Math.hypot(C.x-A.x,C.y-A.y));
    const area = Math.abs((B.x-A.x)*(C.y-A.y) - (C.x-A.x)*(B.y-A.y)) / 2;
    return e < span * 0.34 && area > 1e-8;
  });
}

const box = pts => {
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for (const p of pts) { a=Math.min(a,p.x); b=Math.min(b,p.y); c=Math.max(c,p.x); d=Math.max(d,p.y); }
  return { cx:(a+c)/2, cy:(b+d)/2, w:c-a, h:d-b };
};
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };

function makeFrame(facePts) {
  const b = box(facePts);
  const m = Math.max(b.w, b.h) * 0.15;
  const x0 = b.cx - b.w/2 - m, x1 = b.cx + b.w/2 + m;
  const y0 = b.cy - b.h/2 - m, y1 = b.cy + b.h/2 + m;
  const N = 20, out = [];
  for (let i = 0; i <= N; i++) {
    for (let j = 0; j <= N; j++) {
      const x = -0.04 + 1.08 * i / N;
      const y = -0.04 + 1.08 * j / N;
      if (x > x0 && x < x1 && y > y0 && y < y1) continue;
      out.push({ x, y });
    }
  }
  return out;
}

document.getElementById('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  hint.textContent = '顔を検出中...';
  try {
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();
    const r = landmarker.detectForVideo(img, ++ts);
    if (!r.faceLandmarks?.[0]) { hint.textContent = '顔が見つかりません'; return; }
    srcPts = r.faceLandmarks[0].map(p => ({ x: p.x, y: p.y }));
    smooth = srcPts.map(p => ({ ...p }));
    nFace = srcPts.length;
    scx = 0; scy = 0;
    for (const p of srcPts) { scx += p.x; scy += p.y; }
    scx /= nFace; scy /= nFace;
    allPts = srcPts.concat(makeFrame(srcPts));
    // 背景の各点に、いちばん近い顔ランドマークを割り当てる
    near = new Uint16Array(allPts.length - nFace);
    for (let i = nFace; i < allPts.length; i++) {
      let best = 0, bd = 1e9;
      for (let j = 0; j < nFace; j++) {
        const d = (allPts[i].x - srcPts[j].x)**2 + (allPts[i].y - srcPts[j].y)**2;
        if (d < bd) { bd = d; best = j; }
      }
      near[i - nFace] = best;
    }
    tris = triangulate(allPts);
    if (tris.length < 100) { hint.textContent = 'メッシュ生成に失敗'; return; }
    if (!prog) initGL();
    uploadTexture(img);
    angS = 0; sclS = 1;
    btnStart.disabled = false;
    hint.textContent = `メッシュ ${tris.length} 面。開始を押してください`;
  } catch (err) { hint.textContent = '失敗: ' + err.message; }
};

btnStart.onclick = async () => {
  try {
    if (!video) {
      video = document.createElement('video');
      video.playsInline = true; video.muted = true;
      const st = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: 480, height: 360 }, audio: false });
      video.srcObject = st;
      await video.play();
    }
    btnRec.disabled = false;
    hint.textContent = '';
    loop();
  } catch (err) { hint.textContent = 'カメラ不可: ' + err.message; }
};

function loop() {
  requestAnimationFrame(loop);
  ts = Math.max(performance.now(), ts + 1);
  const r = landmarker.detectForVideo(video, ts);
  const cam = r.faceLandmarks?.[0];

  if (cam) {
    for (let i = 0; i < nFace; i++) {
      smooth[i].x += (1 - cam[i].x - smooth[i].x) * 0.45;
      smooth[i].y += (cam[i].y - smooth[i].y) * 0.45;
    }
  }

  const sb = box(srcPts), cb = box(smooth);
  const faceSize = Math.max(sb.w, sb.h) || 1;
  const gain = (pow.value / 100);

  let ccx = 0, ccy = 0;
  for (let i = 0; i < nFace; i++) { ccx += smooth[i].x; ccy += smooth[i].y; }
  ccx /= nFace; ccy /= nFace;

  // --- 剛体（回転・スケール）は安定点だけで推定 ---
  let re = 0, im = 0, den = 0;
  for (let s = 0; s < STABLE.length; s++) {
    const k = STABLE[s];
    const ax = smooth[k].x - ccx, ay = smooth[k].y - ccy;
    const bx = srcPts[k].x - scx, by = srcPts[k].y - scy;
    re += bx*ax + by*ay;
    im += by*ax - bx*ay;
    den += bx*bx + by*by;
  }
  let ang = Math.atan2(im, re);
  if (!rot.checked) ang = 0;
  let scl = den > 1e-12 ? Math.hypot(re, im) / den : 1;
  scl = Math.min(1.9, Math.max(0.55, scl));
  angS += (ang - angS) * 0.4;
  sclS += (scl - sclS) * 0.4;

  const cs = Math.cos(angS), sn = Math.sin(angS);

  // --- 残差 = 実測 - 剛体予測 → ここに表情が乗る ---
  const resx = new Float32Array(nFace), resy = new Float32Array(nFace);
  let mx = 0, my = 0;
  for (let i = 0; i < nFace; i++) {
    const bx = (srcPts[i].x - scx) * sclS, by = (srcPts[i].y - scy) * sclS;
    const px = ccx + cs*bx - sn*by, py = ccy + sn*bx + cs*by;
    resx[i] = smooth[i].x - px;
    resy[i] = smooth[i].y - py;
    mx += resx[i]; my += resy[i];
  }
  mx /= nFace; my /= nFace;

  // 残差の平均 = 顔全体の移動（弱め・上限あり）
  let t0x = mx * 0.55, t0y = my * 0.55;
  const gmax = faceSize * 0.22, gl0 = Math.hypot(t0x, t0y);
  if (gl0 > gmax) { t0x *= gmax / gl0; t0y *= gmax / gl0; }

  // 表情成分は平均を引いた局所成分。全体移動とは別枠でゲインとクランプを持つ
  const E = 1.7;
  const maxL = faceSize * 0.45;
  const ddx = new Float32Array(nFace), ddy = new Float32Array(nFace);
  for (let i = 0; i < nFace; i++) {
    let ex = (resx[i] - mx) * gain * E;
    let ey = (resy[i] - my) * gain * E;
    const el = Math.hypot(ex, ey);
    if (el > maxL) { ex *= maxL / el; ey *= maxL / el; }
    ddx[i] = t0x + ex;
    ddy[i] = t0y + ey;
  }

  const maxO = faceSize * 0.12;

  const arr = new Float32Array(tris.length * 3 * 4);
  let o = 0;
  for (const tr of tris) {
    const gx = (allPts[tr.a].x + allPts[tr.b].x + allPts[tr.c].x) / 3;
    const gy = (allPts[tr.a].y + allPts[tr.b].y + allPts[tr.c].y) / 3;
    for (const id of [tr.a, tr.b, tr.c]) {
      const s = allPts[id];
      let tx = s.x, ty = s.y;
      if (id < nFace) {
        tx = s.x + ddx[id]; ty = s.y + ddy[id];
      } else {
        const ni = near[id - nFace];
        const d = Math.hypot(s.x - srcPts[ni].x, s.y - srcPts[ni].y) / faceSize;
        const w = 1 - sstep(0, 1.0, d);
        if (w > 0.001) {
          let dx = ddx[ni] * w * 0.55, dy = ddy[ni] * w * 0.55;
          const len = Math.hypot(dx, dy);
          if (len > maxO) { dx *= maxO / len; dy *= maxO / len; }
          tx = s.x + dx; ty = s.y + dy;
        }
      }
      const dx2 = tx - gx, dy2 = ty - gy, l2 = Math.hypot(dx2, dy2) || 1;
      arr[o++] = s.x; arr[o++] = s.y;
      arr[o++] = tx + dx2 / l2 * 0.0015;
      arr[o++] = ty + dy2 / l2 * 0.0015;
    }
  }

  gl.viewport(0, 0, cv.width, cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.drawArrays(gl.TRIANGLES, 0, tris.length * 3);
}

btnRec.onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!MIME) { hint.textContent = 'この端末は録画非対応'; return; }
  chunks = [];
  recorder = new MediaRecorder(cv.captureStream(30), { mimeType: MIME });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: MIME }));
    a.download = MIME.includes('mp4') ? 'out.mp4' : 'out.webm';
    a.click();
    recorder = null;
    btnRec.classList.remove('on');
    btnRec.textContent = '録画';
  };
  recorder.start();
  btnRec.classList.add('on');
  btnRec.textContent = '停止';
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>face drive</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font:14px/1.4 -apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px calc(10px + env(safe-area-inset-bottom));
       display:flex;gap:8px;background:#000c;backdrop-filter:blur(8px)}
  button,input[type=file]::file-selector-button{font:inherit;padding:10px 14px;border-radius:10px;
       border:1px solid #444;background:#222;color:#eee}
  button:disabled{opacity:.4}
  #rec.on{background:#c33;border-color:#c33}
  #hint{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;
       color:#aaa;font-size:12px;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hint">読み込み中...</div>
<div id="bar">
  <input id="file" type="file" accept="image/*">
  <button id="start" disabled>開始</button>
  <button id="rec" disabled>録画</button>
</div>

<script type="importmap">
{"imports":{"@mediapipe/tasks-vision":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"}}
</script>

<script type="module">
import { FaceLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2', { alpha:false, preserveDrawingBuffer:true });
const hint = document.getElementById('hint');
const btnStart = document.getElementById('start');
const btnRec = document.getElementById('rec');

let landmarker, srcPts = null, srcTex = null, tris = [], buf = null, prog = null;
let video = null, smooth = null, recorder = null, chunks = [], ts = 0;

const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const MAX = 1024;

const MIME = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp8','video/webm']
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

async function boot() {
  const fs = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await FaceLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' },
    runningMode: 'VIDEO', numFaces: 1
  });
  hint.textContent = '写真を選んでください';
}
boot().catch(e => hint.textContent = 'モデル読込失敗: ' + e.message);

function initGL() {
  const vs = `#version 300 es
  in vec2 aRest, aTarget;
  out vec2 vUV;
  void main(){
    vUV = aRest;
    gl_Position = vec4(aTarget.x*2.0-1.0, 1.0-aTarget.y*2.0, 0.0, 1.0);
  }`;
  const fs = `#version 300 es
  precision highp float;
  in vec2 vUV; out vec4 o;
  uniform sampler2D uTex;
  void main(){ o = texture(uTex, vUV); }`;
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
  prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const aR = gl.getAttribLocation(prog, 'aRest'), aT = gl.getAttribLocation(prog, 'aTarget');
  gl.enableVertexAttribArray(aR); gl.enableVertexAttribArray(aT);
  gl.vertexAttribPointer(aR, 2, gl.FLOAT, false, 16, 0);
  gl.vertexAttribPointer(aT, 2, gl.FLOAT, false, 16, 8);
}

function uploadTexture(img) {
  let w = img.width, h = img.height;
  if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  srcTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  cv.width = w; cv.height = h;
}

function circ(P, t) {
  const {x:ax,y:ay} = P[t.a], {x:bx,y:by} = P[t.b], {x:cx,y:cy} = P[t.c];
  const d = 2 * (ax*(by-cy) + bx*(cy-ay) + cx*(ay-by));
  if (Math.abs(d) < 1e-12) return { x:0, y:0, r2: Infinity };
  const ux = ((ax*ax+ay*ay)*(by-cy) + (bx*bx+by*by)*(cy-ay) + (cx*cx+cy*cy)*(ay-by)) / d;
  const uy = ((ax*ax+ay*ay)*(cx-bx) + (bx*bx+by*by)*(ax-cx) + (cx*cx+cy*cy)*(bx-ax)) / d;
  return { x:ux, y:uy, r2:(ax-ux)**2 + (ay-uy)**2 };
}

function triangulate(pts) {
  const n = pts.length;
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  for (const p of pts) { mnx=Math.min(mnx,p.x); mny=Math.min(mny,p.y); mxx=Math.max(mxx,p.x); mxy=Math.max(mxy,p.y); }
  const d = Math.max(mxx-mnx, mxy-mny) * 10, cx=(mnx+mxx)/2, cy=(mny+mxy)/2;
  const P = pts.concat([{x:cx-d,y:cy-d},{x:cx,y:cy+d},{x:cx+d,y:cy-d}]);
  let t = [{a:n,b:n+1,c:n+2}];
  for (let i = 0; i < n; i++) {
    const p = P[i], bad = [], keep = [];
    for (const tr of t) {
      const c = circ(P, tr);
      if ((p.x-c.x)**2 + (p.y-c.y)**2 < c.r2) bad.push(tr); else keep.push(tr);
    }
    const edge = new Map();
    for (const tr of bad) for (const [u,v] of [[tr.a,tr.b],[tr.b,tr.c],[tr.c,tr.a]]) {
      const k = u < v ? u+','+v : v+','+u;
      edge.set(k, (edge.get(k) || 0) + 1);
    }
    t = keep;
    for (const [k, c] of edge) if (c === 1) { const [u,v] = k.split(',').map(Number); t.push({a:u,b:v,c:i}); }
  }
  const span = Math.max(mxx-mnx, mxy-mny);
  return t.filter(tr => {
    if (tr.a>=n || tr.b>=n || tr.c>=n) return false;
    const A=P[tr.a],B=P[tr.b],C=P[tr.c];
    const e = Math.max(Math.hypot(A.x-B.x,A.y-B.y), Math.hypot(B.x-C.x,B.y-C.y), Math.hypot(C.x-A.x,C.y-A.y));
    const area = Math.abs((B.x-A.x)*(C.y-A.y) - (C.x-A.x)*(B.y-A.y)) / 2;
    return e < span * 0.32 && area > 1e-7;
  });
}

document.getElementById('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  hint.textContent = '顔を検出中...';
  try {
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();
    const r = landmarker.detectForVideo(img, ++ts);
    if (!r.faceLandmarks?.[0]) { hint.textContent = '顔が見つかりません'; return; }
    srcPts = r.faceLandmarks[0].map(p => ({ x: p.x, y: p.y }));
    smooth = srcPts.map(p => ({ ...p }));
    tris = triangulate(srcPts);
    if (tris.length < 50) { hint.textContent = 'メッシュ生成に失敗'; return; }
    if (!prog) initGL();
    uploadTexture(img);
    btnStart.disabled = false;
    hint.textContent = `メッシュ ${tris.length} 面。開始を押してください`;
  } catch (err) { hint.textContent = '失敗: ' + err.message; }
};

btnStart.onclick = async () => {
  try {
    if (!video) {
      video = document.createElement('video');
      video.playsInline = true; video.muted = true;
      const st = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: 480, height: 360 }, audio: false });
      video.srcObject = st;
      await video.play();
    }
    btnRec.disabled = false;
    hint.textContent = '';
    loop();
  } catch (err) { hint.textContent = 'カメラ不可: ' + err.message; }
};

const box = pts => {
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for (const p of pts) { a=Math.min(a,p.x); b=Math.min(b,p.y); c=Math.max(c,p.x); d=Math.max(d,p.y); }
  return { cx:(a+c)/2, cy:(b+d)/2, h:d-b };
};

function loop() {
  requestAnimationFrame(loop);
  ts = Math.max(performance.now(), ts + 1);
  const r = landmarker.detectForVideo(video, ts);
  const cam = r.faceLandmarks?.[0];
  if (!cam) return;

  for (let i = 0; i < smooth.length; i++) {
    smooth[i].x += (1 - cam[i].x - smooth[i].x) * 0.5;
    smooth[i].y += (cam[i].y - smooth[i].y) * 0.5;
  }

  const sb = box(srcPts), cb = box(smooth);
  const k = sb.h / Math.max(cb.h, 1e-4);

  const arr = new Float32Array(tris.length * 3 * 4);
  let o = 0;
  for (const tr of tris) {
    const gx = (srcPts[tr.a].x + srcPts[tr.b].x + srcPts[tr.c].x) / 3;
    const gy = (srcPts[tr.a].y + srcPts[tr.b].y + srcPts[tr.c].y) / 3;
    for (const id of [tr.a, tr.b, tr.c]) {
      const s = srcPts[id], m = smooth[id];
      const tx = sb.cx + (m.x - cb.cx) * k;
      const ty = sb.cy + (m.y - cb.cy) * k;
      const dx = tx - gx, dy = ty - gy, len = Math.hypot(dx, dy) || 1;
      arr[o++] = s.x; arr[o++] = s.y;
      arr[o++] = tx + dx / len * 0.0015;
      arr[o++] = ty + dy / len * 0.0015;
    }
  }

  gl.viewport(0, 0, cv.width, cv.height);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.drawArrays(gl.TRIANGLES, 0, tris.length * 3);
}

btnRec.onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!MIME) { hint.textContent = 'この端末は録画非対応'; return; }
  chunks = [];
  recorder = new MediaRecorder(cv.captureStream(30), { mimeType: MIME });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: MIME }));
    a.download = MIME.includes('mp4') ? 'out.mp4' : 'out.webm';
    a.click();
    recorder = null;
    btnRec.classList.remove('on');
    btnRec.textContent = '録画';
  };
  recorder.start();
  btnRec.classList.add('on');
  btnRec.textContent = '停止';
};
</script>
</body>
</html>
